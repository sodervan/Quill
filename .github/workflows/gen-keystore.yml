name: Generate Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      key_password:
        description: 'Password for keystore and key'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore quill.keystore \
            -alias quill \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.key_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=Quill, OU=App, O=Quill, L=Lagos, ST=Lagos, C=NG"

      - name: Base64 encode
        run: base64 -w 0 quill.keystore > keystore.b64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: quill-keystore
          path: |
            quill.keystore
            keystore.b64.txt
          retention-days: 1
